# 友链数据
#
# 一组友链的格式如下。想再加一个分组，就把 - class_name 这一段整体复制一份改掉；
# 想在同一个分组里加站点，就复制 link_list 下面那 4 行。
#
# name   站点名称
# link   站点地址（要带 https://）
# avatar 头像图片地址（填错会自动回退成默认头像）
# descr  一句话描述

- class_name: 友情链接
  class_desc: 欢迎交换友链，可在评论区留言或发邮件给我
  link_list:
    - name: 示例站点
      link: https://example.com
      avatar: https://example.com/avatar.png
      descr: 这是一条示例友链，把它替换成你自己的就行