# 友链数据
#
# 一组友链的格式如下。想再加一个分组，就把 - class_name 这一段整体复制一份改掉；
# 想在同一个分组里加站点，就复制 link_list 下面那 4 行。
#
# name   站点名称
# link   站点地址（要带 https://）
# avatar 头像图片地址（留空或加载失败时显示名称首字）
# descr  一句话描述

- class_name: 友情链接
  class_desc: 欢迎交换友链
  link_list:
    - name: Cain
      link: https://cainscain.github.io/
      avatar: https://cainscain.github.io/_astro/avatar.C4oYklyI_IAmHY.webp
      descr: 踽踽同行

    - name: ZXHYCZX
      link: https://zxhyczx.github.io/blog/
      avatar: https://zxhyczx.github.io/blog/_astro/avatar.DodcwRNI_a9jzn.webp
      descr: 分享技术与生活

    - name: 尺衡旦日
      link: https://lingyu061126.github.io/
      avatar: https://lingyu061126.github.io/images/Image_165853659272824.jpg
      descr: 电气专业本科生 / 二次元重度依赖 / 有些不同于常人的想法 / 被理性所困

    - name: Fat Old Eight
      link: https://fat-old-eight.github.io/
