# 友链数据
#
# 一组友链的格式如下。想再加一个分组，就把 - class_name 这一段整体复制一份改掉；
# 想在同一个分组里加站点，就复制 link_list 下面那 4 行。
#
# name   站点名称
# link   站点地址（要带 https://）
# avatar 头像图片地址（填错会自动回退成默认头像）
# descr  一句话描述

- class_name: 友情链接
  class_desc: 欢迎交换友链
  link_list:
    - name: Cain
      link: https://cainscain.github.io/
      avatar: https://cainscain.github.io/_astro/avatar.C4oYklyI_IAmHY.webp
      descr: 踽踽同行

    - name: ZXHYCZX
      link: https://zxhyczx.github.io/blog/
      avatar: https://zxhyczx.github.io/blog/_astro/avatar.DodcwRNI_a9jzn.webp
      descr: 分享技术与生活